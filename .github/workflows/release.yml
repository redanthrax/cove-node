# Publish to npm via OIDC trusted publishing (required).
# Configure at https://www.npmjs.com/package/n8n-nodes-cove → Settings → Publishing access → GitHub Actions.
name: Release

on:
  # Tag push is the only automatic trigger. A `release: published` trigger was removed
  # because publishing a GitHub release for an existing tag re-ran the publish job.
  push:
    tags:
      - '*.*.*'
  # Manual re-run of a failed publish; must be dispatched against a tag ref (enforced below).
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read # checkout
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          package-manager-cache: false
          # No dependency cache in the release job: a cache written by another workflow
          # could be poisoned and end up in the published artifact.
          # Do NOT set registry-url here — it writes _authToken=${NODE_AUTH_TOKEN} to .npmrc,
          # which can block OIDC trusted publishing and surface as a misleading 404 on publish.

      - name: Install npm for OIDC trusted publishing
        run: npm install -g npm@11.5.1 # zizmor: ignore[adhoc-packages] exact version pin; npm >= 11.5.1 is required for OIDC

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supply chain check
        run: pnpm run audit:supply-chain

      - name: pnpm audit (high severity and above)
        run: pnpm audit --audit-level=high

      - name: OSV vulnerability scan (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

      - name: Build
        run: pnpm run build

      - name: Lint (prepublish rules)
        run: pnpm exec eslint -c eslint.config.prepublish.mjs nodes credentials package.json

      - name: Publish to npm
        run: |
          npm --version
          npm publish --provenance --access public
