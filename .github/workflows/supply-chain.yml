name: Supply chain security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Daily check for lockfile drift and known compromised versions
    - cron: '0 12 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: pnpm

      - name: Install dependencies (frozen lockfile, no lifecycle scripts except allowlist)
        run: pnpm install --frozen-lockfile

      - name: Supply chain check (blocklist + pnpm config)
        run: pnpm run audit:supply-chain

      - name: pnpm audit (high severity and above)
        run: pnpm audit --audit-level=high

      - name: OSV vulnerability scan (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@c5996e0193a3df57d695c1b8a1dec2a4c62e8730 # v2.3.3
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint
