name: Supply chain security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Daily check for lockfile drift and known compromised versions
    - cron: '0 12 * * *'

permissions:
  contents: read # checkout only

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          cache: pnpm

      - name: Install dependencies (frozen lockfile, no lifecycle scripts except allowlist)
        run: pnpm install --frozen-lockfile

      - name: Supply chain check (blocklist + pnpm config)
        run: pnpm run audit:supply-chain

      - name: pnpm audit (high severity and above)
        run: pnpm audit --audit-level=high

      - name: OSV vulnerability scan (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint
